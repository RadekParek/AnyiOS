pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'AnyiOS'
include ':app'

include ":converter", ":compat-runtime-v1", ":converted-template", ":gameruntime-template", ":placeholder-template"
project(":converter").projectDir = file("converter/app")
project(":compat-runtime-v1").projectDir = file("converter/compat-runtime-v1")
project(":converted-template").projectDir = file("converter/converted-template")
project(":gameruntime-template").projectDir = file("converter/gameruntime-template")
project(":placeholder-template").projectDir = file("converter/placeholder-template")
include ':anyiose-template'
project(':anyiose-template').projectDir = file('converter/anyiose-template')
