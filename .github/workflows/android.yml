name: AnyiOS builds
# Two artifacts only: the Android APK and the Linux PC build. Host tests run inside
# the PC job so a red build still means something without producing extra artifacts.
on:
  # A branch push and its pull request run the same two jobs; validating the pull
  # request and main is enough, and it stops every change being built twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the Android APK (skip the PC job and converter tests)
        required: false
        type: boolean
        default: false
concurrency:
  group: anyios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    name: Android APK
    uses: ./.github/workflows/build.yml
    with:
      variant: release
      artifact: AnyiOS.apk
      app_only: ${{ github.event_name == 'workflow_dispatch' && inputs.android_only }}
    secrets: inherit
  pc:
    name: PC build (Linux x86-64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.android_only != true }}
    uses: ./.github/workflows/runtime.yml
