name: AnyiOS builds
# Android, Linux and Windows builds publish platform-specific artifacts. Host suites run
# inside the PC jobs so a red build still means something without separate test artifacts.
on:
  # A branch push and its pull request run the same two jobs; validating the pull
  # request and main is enough, and it stops every change being built twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the Android APK (skip the PC jobs and converter tests)
        required: false
        type: boolean
        default: false
concurrency:
  group: anyios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    name: Android APK
    uses: ./.github/workflows/build.yml
    with:
      variant: release
      artifact: AnyiOS.apk
      app_only: ${{ github.event_name == 'workflow_dispatch' && inputs.android_only }}
    secrets: inherit
  pc:
    name: PC builds (Linux and Windows x86-64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.android_only != true }}
    uses: ./.github/workflows/runtime.yml
  engine-tests:
    name: AnyiOSEMU unit and guest tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.android_only != true }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Prepare pinned AnyiOSEMU sources
        run: scripts/prepare-anyiose-runtime.sh
      - name: Restore pinned Boost headers
        id: engine-boost
        uses: actions/cache/restore@v4
        with:
          path: third_party/anyiose-engine/vendor/boost
          key: ${{ runner.os }}-engine-boost-${{ hashFiles('third_party/anyiose-runtime-boost-version.txt') }}
      - name: Prepare Boost headers
        run: scripts/prepare-anyiose-runtime-boost.sh
      - name: Save pinned Boost headers
        if: ${{ steps.engine-boost.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: third_party/anyiose-engine/vendor/boost
          key: ${{ steps.engine-boost.outputs.cache-primary-key }}
      - name: Cache engine Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/anyiose-engine -> target
          cache-on-failure: true
      - name: Restore guest compiler
        id: guest-compiler
        uses: actions/cache/restore@v4
        with:
          path: third_party/anyiose-engine/tests/llvm
          key: llvm-12.0.0-macos-x86_64-testapp
      - name: Install LLVM 12 guest compiler
        if: ${{ steps.guest-compiler.outputs.cache-hit != 'true' }}
        working-directory: third_party/anyiose-engine/tests
        run: |
          curl --fail --location --retry 3 -o llvm.tar.xz \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz'
          mkdir -p llvm
          tar -xf llvm.tar.xz --strip-components=1 -C llvm
          rm llvm.tar.xz
      - name: Save guest compiler
        if: ${{ steps.guest-compiler.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: third_party/anyiose-engine/tests/llvm
          key: ${{ steps.guest-compiler.outputs.cache-primary-key }}
      - name: Install guest SDK
        working-directory: third_party/anyiose-engine/tests
        run: |
          curl --fail --location --retry 3 -o sdk.tar.gz \
            'https://github.com/touchHLE/common-3.0-sdk/releases/download/v0.3.7/common-3.0.sdk-macOS-universal.tar.gz'
          echo '16cedbc008841b8367037e36826385947d8a9aa4125b825707f7923bad834498  sdk.tar.gz' | shasum -a 256 -c
          tar -xzf sdk.tar.gz
          rm sdk.tar.gz
      - name: Run full Cargo suite including guest TestApp
        working-directory: third_party/anyiose-engine
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          set +e
          cargo test --locked --target x86_64-apple-darwin 2>&1 | tee "$RUNNER_TEMP/anyiose-cargo-tests.log"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Keep failure details visible in check annotations even when a
            # client cannot retrieve the Actions log archive. Do not mask the
            # original test failure or its exit status.
            python3 - <<'PY'
          import os
          from pathlib import Path

          log = Path(os.environ['RUNNER_TEMP']) / 'anyiose-cargo-tests.log'
          tail = log.read_text(errors='replace')[-18000:]
          chunks = [tail[i:i + 3000] for i in range(0, len(tail), 3000)]
          # GitHub caps an individual annotation at 4096 characters. Emit
          # the last chunk first, then earlier context without truncation.
          for number, chunk in enumerate(reversed(chunks), start=1):
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=AnyiOSEMU test failure (tail {number})::{escaped}')
          PY
          fi
          exit "$status"
