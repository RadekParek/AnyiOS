name: Android debug
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      variant: debug
      artifact: PodNative-debug.apk
