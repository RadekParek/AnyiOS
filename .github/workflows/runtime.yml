name: Runtime correctness
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    name: ARM32 on x86-64 correctness (not desktop product support)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Sanitizer and real-engine tests
        run: |
          mkdir -p .local/logs
          set -o pipefail
          scripts/test-host.sh 2>&1 | tee .local/logs/runtime-sanitizers.log
          scripts/test-cpu.sh 2>&1 | tee .local/logs/cpu-host.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-host-reports
          include-hidden-files: true
          path: |
            .local/logs/
            .local/cpu-tests/Testing/Temporary/
  android-arm64:
    name: Compile real-engine A32 on Android ARM64 (execution pending)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare NDK and pinned CPU sources
        run: |
          mkdir -p .local/logs
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 2>&1 | tee .local/logs/cpu-sdk.log
          scripts/prepare-cpu.sh 2>&1 | tee .local/logs/cpu-deps.log
      - name: Cross-compile Android instruction test executable
        run: |
          set -o pipefail
          cmake -S tests -B .local/cpu-arm64 \
            -DDYNARMIC_ROOT="$PWD/.local/deps/dynarmic" \
            -DBOOST_ROOT="$PWD/.local/boost-headers" -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD -DCMAKE_POLICY_DEFAULT_CMP0144=NEW \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee .local/logs/cpu-configure.log
          cmake --build .local/cpu-arm64 --parallel 2 2>&1 | tee .local/logs/cpu-android-build.log
          mkdir -p .local/cpu-artifact
          cp .local/cpu-arm64/cpu_test .local/cpu-artifact/PodNative-arm64-cpu-test
          cp .local/cpu-arm64/oaknut_wx_test .local/cpu-artifact/PodNative-arm64-wx-test
          readelf -h .local/cpu-artifact/PodNative-arm64-cpu-test | grep AArch64
          cd .local/cpu-artifact
          sha256sum PodNative-arm64-cpu-test PodNative-arm64-wx-test > SHA256SUMS
          printf 'source=%s\ndynarmic=%s\nAndroid compilation only; no device execution occurred.\n' \
            "$GITHUB_SHA" "$(cat ../../third_party/dynarmic/revision.txt)" > BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PodNative-arm64-cpu-test
          include-hidden-files: true
          path: .local/cpu-artifact/
          if-no-files-found: error
      - name: API-visible failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for path in Path('.local/logs').glob('*.log'):
              message = (path.name + ': ' + '\n'.join(path.read_text(errors='replace').splitlines()[-12:])).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning::' + message)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-android-build-logs
          include-hidden-files: true
          path: .local/logs/
