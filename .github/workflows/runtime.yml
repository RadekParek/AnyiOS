name: PC build
# Linux runs the full host/converter validation and publishes the Linux artifact. Windows
# builds the same real-engine CPU/HLE runner and suites with a native MinGW toolchain.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  pc:
    name: Linux x86-64 build and host suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install host test tools
        run: python3 -m pip install 'capstone==5.0.7' 'unicorn==2.1.4' pyyaml
      # Both suites below compile the pinned dynarmic tree from scratch on every run.
      # ccache is content-addressed, so a wide restore key still only ever returns an
      # object file that was produced from identical preprocessed input.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('third_party/dynarmic/revision.txt', 'third_party/converter-runtime/dynarmic-revision.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ hashFiles('third_party/dynarmic/revision.txt', 'third_party/converter-runtime/dynarmic-revision.txt') }}-
            ${{ runner.os }}-ccache-
      - name: Enable ccache for the pinned CPU builds
        run: |
          if ! command -v ccache >/dev/null; then
            echo 'ccache is not available on this runner; compiling without it.' >&2
            exit 0
          fi
          mkdir -p ~/.ccache "$RUNNER_TEMP/ccache-bin"
          for name in cc gcc g++ c++ clang clang++; do
            ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/$name"
          done
          echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
          echo 'CCACHE_NOHASHDIR=1' >> "$GITHUB_ENV"
          ccache --max-size=2G >/dev/null
      - name: Cache pinned CPU sources
        uses: actions/cache@v4
        with:
          path: |
            .local/deps
            .local/boost-headers
            .local/converter-dynarmic
          key: ${{ runner.os }}-cpu-sources-${{ hashFiles('third_party/dynarmic/revision.txt', 'third_party/dynarmic/boost-revision.txt', 'third_party/dynarmic/patches/*', 'third_party/converter-runtime/dynarmic-revision.txt') }}
      - name: Host runtime suites (sanitizers, strict warnings)
        run: |
          mkdir -p .local/logs
          set -o pipefail
          scripts/test-host.sh 2>&1 | tee .local/logs/runtime-sanitizers.log
      - name: Real-engine CPU suites
        run: |
          set -o pipefail
          scripts/test-cpu.sh 2>&1 | tee .local/logs/cpu-host.log
      - name: Converter regressions
        run: |
          set -o pipefail
          scripts/test-converter.sh 2>&1 | tee .local/logs/converter-tests.log
      - name: Formatting and script lint
        run: |
          set -o pipefail
          python3 -m pip install 'clang-format==19.1.7' 'ruff==0.8.4'
          scripts/check-format.sh 2>&1 | tee .local/logs/format.log
      - name: Package PC build
        run: |
          mkdir -p .local/pc-artifact
          cp .local/cpu-tests/cpu_test .local/pc-artifact/AnyiOS-linux-x86_64-cpu-test
          cp .local/cpu-tests/oaknut_wx_test .local/pc-artifact/AnyiOS-linux-x86_64-wx-test
          cp .local/cpu-tests/dyld_test .local/pc-artifact/AnyiOS-linux-x86_64-dyld-test
          cp .local/cpu-tests/libc_test .local/pc-artifact/AnyiOS-linux-x86_64-libc-test
          cp .local/cpu-tests/objc_test .local/pc-artifact/AnyiOS-linux-x86_64-objc-test
          # Runs a real .app bundle through the same entry point the app uses and prints the
          # launch report, so a compatibility report can be reproduced on a desktop.
          cp .local/cpu-tests/guest_runner .local/pc-artifact/AnyiOS-linux-x86_64-guest-runner
          cp -r third_party/dynarmic/notices .local/pc-artifact/third-party-notices
          cp third_party/dynarmic/LICENSE.txt .local/pc-artifact/third-party-notices/dynarmic.txt
          cp THIRD_PARTY_NOTICES.md .local/pc-artifact/
          cp third_party/dynarmic/revision.txt .local/pc-artifact/CPU-REVISION.txt
          printf 'source=%s\nLinux x86-64 CPU/HLE test build. Not a desktop game emulator.\n' \
            "$GITHUB_SHA" > .local/pc-artifact/BUILD-INFO.txt
          cd .local/pc-artifact
          sha256sum AnyiOS-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AnyiOS-PC-linux-x86_64
          include-hidden-files: true
          path: .local/pc-artifact/
          if-no-files-found: error
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for path in sorted(Path('.local/logs').glob('*.log')):
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-15:])
              message = (path.name + ': ' + tail).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning::' + message)
          PYCODE

  windows:
    name: Windows x86-64 build and CPU/HLE suites
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_EXE_LINKER_FLAGS: -static -static-libgcc -static-libstdc++
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Verify the Windows toolchain
        run: |
          cmake --version
          ninja --version
          g++ --version
      - name: Build and run real-engine CPU/HLE suites
        run: |
          mkdir -p .local/logs
          set -o pipefail
          scripts/test-cpu.sh 2>&1 | tee .local/logs/windows-cpu.log
      - name: Windows failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          log = Path('.local/logs/windows-cpu.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()[-30:]
              message = 'Windows CPU/HLE log tail:\n' + '\n'.join(lines)
          else:
              message = 'Windows CPU/HLE log was not created.'
          message = message[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Windows CPU/HLE failure::' + message)
          PYCODE
      - name: Package Windows host build
        run: |
          mkdir -p .local/pc-artifact
          cp .local/cpu-tests/guest_runner.exe .local/pc-artifact/AnyiOS-windows-x86_64-guest-runner.exe
          cp .local/cpu-tests/cpu_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-cpu-test.exe
          cp .local/cpu-tests/runtime_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-runtime-test.exe
          cp .local/cpu-tests/uikit_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-uikit-test.exe
          cp .local/cpu-tests/audio_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-audio-test.exe
          cp .local/cpu-tests/cxx_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-cxx-test.exe
          cp .local/cpu-tests/dyld_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-dyld-test.exe
          cp .local/cpu-tests/libc_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-libc-test.exe
          cp .local/cpu-tests/objc_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-objc-test.exe
          cp .local/cpu-tests/pvrtc_test.exe .local/pc-artifact/AnyiOS-windows-x86_64-pvrtc-test.exe
          cp -r third_party/dynarmic/notices .local/pc-artifact/third-party-notices
          cp third_party/dynarmic/LICENSE.txt .local/pc-artifact/third-party-notices/dynarmic.txt
          cp THIRD_PARTY_NOTICES.md .local/pc-artifact/
          cp third_party/dynarmic/revision.txt .local/pc-artifact/CPU-REVISION.txt
          printf 'source=%s\nWindows x86-64 CPU/HLE host build. No Windows ANGLE driver is bundled; not visual-rendering proof.\n' \
            "$GITHUB_SHA" > .local/pc-artifact/BUILD-INFO.txt
          cd .local/pc-artifact
          sha256sum AnyiOS-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AnyiOS-PC-windows-x86_64
          include-hidden-files: true
          path: .local/pc-artifact/
          if-no-files-found: error
