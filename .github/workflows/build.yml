name: Android build pipeline
on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      artifact:
        required: true
        type: string
      app_only:
        description: Skip converter tests and build only the Android app
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          # Prepare Gradle before initializing SDL's unused nested wrapper JAR below;
          # the app build uses the pinned installed Gradle distribution, not SDL's wrapper.
          submodules: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare pinned AnyiOSEMU engine source
        run: scripts/prepare-anyiose-runtime.sh
      - name: Cache pinned AnyiOSEMU Boost headers
        id: anyiose-boost-cache
        uses: actions/cache@v4
        with:
          path: third_party/anyiose-engine/vendor/boost
          key: ${{ runner.os }}-boost-v2-${{ hashFiles('third_party/anyiose-runtime-boost-version.txt', 'scripts/prepare-anyiose-runtime-boost.sh') }}
      - name: Verify or prepare pinned AnyiOSEMU Boost headers
        env:
          BOOST_ROOT: ${{ github.workspace }}/third_party/anyiose-engine/vendor/boost
        run: |
          scripts/prepare-anyiose-runtime-boost.sh
          test -f "$BOOST_ROOT/boost/config.hpp"
          test -f "$BOOST_ROOT/boost/version.hpp"
          echo "BOOST_ROOT=$BOOST_ROOT" >> "$GITHUB_ENV"
          echo "Boost_ROOT=$BOOST_ROOT" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDEDIR=$BOOST_ROOT" >> "$GITHUB_ENV"
      - name: Install Rust Android toolchain
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@3.5.4
          rustc --version
          cargo --version
          cargo ndk --version
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-dependencies-v1-${{ hashFiles('third_party/anyiose-engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dependencies-v1-
      - name: Cache AnyiOSEMU Rust Android build
        uses: actions/cache@v4
        with:
          # Keep target artifacts isolated by the exact native-build inputs. In
          # particular, do not restore an older CMakeCache across ABI/patch changes.
          path: third_party/anyiose-engine/target
          key: ${{ runner.os }}-android-ndk-27.2.12479018-anyiose-rust-v3-${{ hashFiles('app/build.gradle', 'third_party/anyiose-runtime-revision.txt', 'third_party/anyiose-runtime-patches/AnyiOSEMU.patch', 'third_party/anyiose-runtime-patches/SDL-Android-NDK-27.patch', 'third_party/anyiose-engine/Cargo.lock', 'third_party/anyiose-engine/**/Cargo.toml') }}
      - name: Refresh cached Dynarmic CMake state
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          # CMake-generated makefiles from a different runner can rebuild unwanted
          # Dynarmic host tests with stale flags. Reconfigure this one crate while
          # keeping the remaining cached Rust dependencies and SDL objects.
          if [ -d third_party/anyiose-engine/target ]; then
            profile=()
            if [ "$VARIANT" = release ]; then profile+=(--release); fi
            cargo clean --locked --manifest-path third_party/anyiose-engine/Cargo.toml \
              --package touchHLE_dynarmic_wrapper --target aarch64-linux-android "${profile[@]}"
          fi
      # Development keys only, never release signing material. Cache eviction can
      # change this certificate; durable distribution requires configured signing secrets.
      - name: Reuse development signing identity when cached
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: podnative-debug-keystore-v1-${{ github.repository_id }}
      - name: Inspect runner Android toolchain
        run: |
          mkdir -p .local/logs
          {
            printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT"
            command -v sdkmanager || true
            java -version
            df -h .
          } 2>&1 | tee .local/logs/environment.log
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install application SDK
        run: |
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 2>&1 | tee .local/logs/sdk-install.log
          # cargo-ndk-android unconditionally reads local.properties for ndk.dir.
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/27.2.12479018\n' "$ANDROID_HOME" "$ANDROID_HOME" > local.properties
      - name: Prepare Cargo SDL source for Android NDK 27
        run: |
          set -o pipefail
          scripts/prepare-anyiose-runtime-sdl.sh 2>&1 | tee .local/logs/rust-sdl-prepare.log
      - name: Formatting and script lint
        run: |
          pipx install clang-format==19.1.7
          pipx install ruff==0.11.13
          scripts/check-format.sh
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -p 'test_runtime_contracts.py'
          rustc --edition=2021 --test tests/runtime_geometry.rs -o .local/runtime-geometry-test
          .local/runtime-geometry-test
      # Cloning dynarmic and assembling Boost's header tree takes over a minute per run
      # and is identical for identical pins. prepare-cpu.sh re-verifies the revision and
      # the reviewed patch, so a restored tree is still proven to be the pinned one.
      - name: Cache pinned CPU sources
        uses: actions/cache@v4
        with:
          path: |
            .local/deps
            .local/boost-headers
            .local/converter-dynarmic
          key: ${{ runner.os }}-cpu-sources-${{ hashFiles('third_party/dynarmic/revision.txt', 'third_party/dynarmic/boost-revision.txt', 'third_party/dynarmic/patches/*', 'third_party/converter-runtime/dynarmic-revision.txt') }}
      - name: Prepare pinned application CPU engine
        run: |
          set -o pipefail
          scripts/prepare-cpu.sh 2>&1 | tee .local/logs/app-cpu-prepare.log
          cmp third_party/dynarmic/revision.txt app/src/main/assets/cpu-notices/revision.txt
          cmp third_party/dynarmic/LICENSE.txt app/src/main/assets/cpu-notices/dynarmic.txt
          for text in third_party/dynarmic/notices/*.txt; do cmp "$text" "app/src/main/assets/cpu-notices/$(basename "$text")"; done
      - name: Prepare pinned converter runtime and notices
        run: scripts/prepare-converter.sh
      - name: Restore verified upstream ANGLE build outputs
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ runner.os }}-arm64-angle-${{ hashFiles('third_party/angle/revision.txt', 'scripts/build-angle.sh', 'scripts/check-native-deps.py', 'scripts/collect-angle-notices.py', 'scripts/bootstrap-angle-tools.sh', 'third_party/angle/depot-tools-revision.txt') }}
          path: |
            third_party/angle/lib/arm64-v8a/
            third_party/angle/include/
            app/src/main/jniLibs/arm64-v8a/
            app/src/main/assets/angle-notices/
            app/src/main/assets/angle-revision.txt
      - name: Bootstrap upstream ANGLE build tools
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          scripts/bootstrap-angle-tools.sh "$RUNNER_TEMP/depot_tools" 2>&1 | tee .local/logs/depot-bootstrap.log
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          git -C "$RUNNER_TEMP/depot_tools" rev-parse HEAD > .local/logs/depot-tools-revision.txt
      - name: Build pinned real ANGLE
        id: build-angle
        if: steps.angle-cache.outputs.cache-hit != 'true'
        env:
          ANGLE_INSTALL_DEPS: '1'
          DEPOT_TOOLS_UPDATE: '0'
        run: |
          set -o pipefail
          scripts/build-angle.sh 2>&1 | tee .local/logs/angle-build.log
      - name: Audit cached or freshly built ANGLE inputs
        run: |
          python3 scripts/check-native-deps.py third_party/angle/lib/arm64-v8a
          cmp third_party/angle/revision.txt app/src/main/assets/angle-revision.txt
          cmp third_party/angle/lib/arm64-v8a/libEGL_podnative.so app/src/main/jniLibs/arm64-v8a/libEGL_angle.so
          cmp third_party/angle/lib/arm64-v8a/libGLESv1_CM_podnative.so app/src/main/jniLibs/arm64-v8a/libGLESv1_CM_angle.so
          cmp third_party/angle/lib/arm64-v8a/libGLESv2_podnative.so app/src/main/jniLibs/arm64-v8a/libGLESv2_angle.so
      - name: Cache verified ANGLE before compiling the application
        if: steps.angle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.angle-cache.outputs.cache-primary-key }}
          path: |
            third_party/angle/lib/arm64-v8a/
            third_party/angle/include/
            app/src/main/jniLibs/arm64-v8a/
            app/src/main/assets/angle-notices/
            app/src/main/assets/angle-revision.txt
      # A debuggable APK is what Play Protect and Samsung's installer warn about.
      # Sign the release variant with the same cached certificate so it stays
      # non-debuggable yet still upgrades an already-installed preview build.
      - name: Ensure preview signing identity
        if: inputs.variant == 'release'
        run: |
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          echo "PODNATIVE_PREVIEW_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Configure optional release signing
        if: inputs.variant == 'release'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/podnative.jks"
            echo "PODNATIVE_KEYSTORE=$RUNNER_TEMP/podnative.jks" >> "$GITHUB_ENV"
          fi
      - name: Lint, test and build
        env:
          VARIANT: ${{ inputs.variant }}
          APP_ONLY: ${{ inputs.app_only }}
          PODNATIVE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PODNATIVE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PODNATIVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$APP_ONLY" = true ]; then
            # Targeted manual builds still compile the app's converter dependency, but do not
            # invoke converter lint or test tasks, or the separate PC converter suite.
            if [ "$VARIANT" = debug ]; then
              gradle --no-daemon --build-cache --parallel :app:lintDebug :app:testDebugUnitTest :anyiose-template:testDebugUnitTest :app:assembleDebug 2>&1 | tee .local/logs/android-build.log
            else
              gradle --no-daemon --build-cache --parallel :app:lintRelease :app:testReleaseUnitTest :anyiose-template:testReleaseUnitTest :app:assembleRelease 2>&1 | tee .local/logs/android-build.log
            fi
          elif [ "$VARIANT" = debug ]; then
            gradle --no-daemon --build-cache --parallel :app:lintDebug :app:testDebugUnitTest :converter:lintDebug :converter:testDebugUnitTest :gameruntime-template:testDebugUnitTest :anyiose-template:testDebugUnitTest :app:assembleDebug 2>&1 | tee .local/logs/android-build.log
          else
            gradle --no-daemon --build-cache --parallel :app:lintRelease :app:testReleaseUnitTest :converter:lintRelease :converter:testReleaseUnitTest :anyiose-template:testReleaseUnitTest :app:assembleRelease 2>&1 | tee .local/logs/android-build.log
          fi
      - name: Verify Android Dynarmic target architecture
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          BUILD_ROOT="third_party/anyiose-engine/target/aarch64-linux-android/$VARIANT/build"
          CMAKE_CACHE=$(find "$BUILD_ROOT" -path '*/touchHLE_dynarmic_wrapper-*/out/build/CMakeCache.txt' -print -quit)
          if [ -z "$CMAKE_CACHE" ]; then
            echo 'Dynarmic Android CMake cache was not created.' >&2
            exit 1
          fi
          for expected in 'ARCHITECTURE=arm64' 'DYNARMIC_TESTS=OFF' \
                          'DYNARMIC_WARNINGS_AS_ERRORS=OFF' 'BUILD_TESTING=OFF'; do
            key=${expected%%=*}
            value=${expected#*=}
            if ! grep -Eq "^${key}:[^=]*=${value}$" "$CMAKE_CACHE"; then
              echo "Unexpected Dynarmic Android CMake option: expected $expected" >&2
              grep -E '^(ARCHITECTURE|CMAKE_SYSTEM_PROCESSOR|DYNARMIC_TESTS|DYNARMIC_WARNINGS_AS_ERRORS|BUILD_TESTING):' "$CMAKE_CACHE" || true
              exit 1
            fi
          done
      - name: Prepare APK and provenance
        env:
          VARIANT: ${{ inputs.variant }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          mkdir -p .local/artifacts
          APK=$(find "app/build/outputs/apk/$VARIANT" -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" ".local/artifacts/$ARTIFACT"
          # The AnyiOSEMU runtime is loaded on demand; Bionic rejects initial-exec TLS
          # relocations in a DSO dlopened after process startup. Guard the final ARM64 ELF.
          TLS_SO="$RUNNER_TEMP/libAnyiOSEMU.so"
          TLS_RELOCS="$RUNNER_TEMP/AnyiOSEMU-relocations.txt"
          unzip -p "$APK" lib/arm64-v8a/libtouchHLE.so > "$TLS_SO"
          test -s "$TLS_SO"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" --relocations --wide "$TLS_SO" > "$TLS_RELOCS"
          if grep -E 'R_AARCH64_TLS_TPREL|R_AARCH64_TLSIE_' "$TLS_RELOCS"; then
            echo 'Refusing to package AnyiOSEMU with initial-exec TLS relocations.' >&2
            exit 1
          fi
          echo 'AnyiOSEMU has no initial-exec TLS relocations.'
          cd .local/artifacts
          sha256sum "$ARTIFACT" > SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$ARTIFACT" > APK-BADGING.txt
          grep -F "package: name='org.podnative'" APK-BADGING.txt
          grep -F "launchable-activity: name='org.podnative.ModuleActivity'" APK-BADGING.txt
          grep -F "application-label:'AnyiOS'" APK-BADGING.txt
          # A debuggable or unsigned build is what installers and Play Protect warn about.
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$ARTIFACT" --file AndroidManifest.xml > .manifest.txt
          if [ "$VARIANT" != debug ] && grep -Eq 'android:debuggable.*(true|0xffffffff)' .manifest.txt; then
            echo 'Refusing to publish a debuggable APK as the user-facing build.' >&2
            exit 1
          fi
          rm -f .manifest.txt
          printf 'source=%s\nangle=%s\nanyiose_runtime=%s\nvariant=%s\nsigning=%s\ndebuggable=false\n' "$GITHUB_SHA" "$(cat ../../third_party/angle/revision.txt)" "$(cat ../../third_party/anyiose-runtime-revision.txt)" "$VARIANT" "${PODNATIVE_KEYSTORE:+configured}${PODNATIVE_PREVIEW_KEYSTORE:+preview}" > BUILD-INFO.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$ARTIFACT" >> BUILD-INFO.txt || {
            if [ "$VARIANT" = debug ] || [ -n "${PODNATIVE_KEYSTORE:-}" ] || [ -n "${PODNATIVE_PREVIEW_KEYSTORE:-}" ]; then exit 1; fi
            echo 'UNSIGNED release: not installable until signed; not a published signed release.' >> BUILD-INFO.txt
          }
          # Installers only accept modern signature schemes; v2/v3 also stop the
          # "invalid or unknown signer" family of installer warnings.
          if [ -n "${PODNATIVE_KEYSTORE:-}${PODNATIVE_PREVIEW_KEYSTORE:-}" ]; then
            verify=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$ARTIFACT")
            echo "$verify" >> BUILD-INFO.txt
            echo "$verify" | grep -Eq 'Verified using v2 scheme .*: true' || {
              echo 'Refusing to publish an APK without APK Signature Scheme v2.' >&2
              exit 1
            }
          fi
          printf 'converter=%s\nconverter_cpu=%s\n' "$(cat ../../converter/UPSTREAM_REVISION)" "$(cat ../../third_party/converter-runtime/dynarmic-revision.txt)" >> BUILD-INFO.txt
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libEGL_podnative.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libGLESv2_podnative.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libEGL_angle.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libGLESv1_CM_angle.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libGLESv2_angle.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libtouchHLE.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libSDL2.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libc++_shared.so'
          unzip -l "$ARTIFACT" | grep 'assets/anyiose-runtime-notices.txt'
          unzip -l "$ARTIFACT" | grep 'assets/angle-notices/INDEX.txt'
          unzip -l "$ARTIFACT" | grep 'assets/anyiose-rust-dependencies.txt'
          unzip -l "$ARTIFACT" | grep 'assets/anyiose-dynarmic-license.txt'
          unzip -l "$ARTIFACT" | grep 'assets/LICENSE'
          unzip -l "$ARTIFACT" | grep 'assets/vendor/SDL/LICENSE.txt'
          unzip -l "$ARTIFACT" | grep 'assets/vendor/dynarmic/LICENSE.txt'
          unzip -l "$ARTIFACT" | grep 'assets/vendor/openal-soft/COPYING'
          unzip -l "$ARTIFACT" | grep 'assets/AnyiOSEMU_dylibs/COPYING.libstdcxx'
          unzip -l "$ARTIFACT" | grep 'assets/AnyiOSEMU_fonts/LICENSE.noto'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libcompat_runtime_v1.so'
          unzip -l "$ARTIFACT" | grep 'lib/arm64-v8a/libradek.so'
          unzip -l "$ARTIFACT" | grep 'assets/gameruntime-template/classes.dex'
          unzip -l "$ARTIFACT" | grep 'assets/anyiose-template/classes.dex'
          unzip -l "$ARTIFACT" | grep 'assets/anyiose-template/AndroidManifest.xml'
          unzip -l "$ARTIFACT" | grep 'assets/AnyiOSEMU_default_options.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: .local/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Annotate last build diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.local/logs').glob('*.log'):
              all_lines = path.read_text(errors='replace').splitlines()
              markers = (
                  'e: file:', 'error:', ' failed', 'failure', 'exception', 'caused by:',
                  'could not', 'cannot ', 'unable to', 'not found', 'no such file',
                  'permission denied', 'unresolved reference', 'undefined reference',
                  'linker', 'panic', 'what went wrong:', 'execution failed for task',
                  'non-zero exit', 'duplicate class', 'failures!!!',
              )
              matching = [i for i, line in enumerate(all_lines)
                          if any(marker in line.lower() for marker in markers)]
              errors = []
              for index in matching[-15:]:
                  errors.extend(all_lines[max(0, index - 1):min(len(all_lines), index + 4)])
              lines = list(dict.fromkeys(errors + all_lines[-20:]))
              message = (path.name + ': ' + '\n'.join(lines)).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning::' + message)
          for path in Path('third_party/anyiose-engine/target').rglob('CMakeCache.txt'):
              if 'touchHLE_dynarmic_wrapper-' not in str(path):
                  continue
              keys = ('ARCHITECTURE:', 'CMAKE_SYSTEM_PROCESSOR:', 'DYNARMIC_TESTS:',
                      'DYNARMIC_WARNINGS_AS_ERRORS:', 'BUILD_TESTING:')
              lines = [line for line in path.read_text(errors='replace').splitlines()
                       if line.startswith(keys)]
              message = (str(path) + ': ' + '\n'.join(lines)).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning::' + message)
          for root in ('app/build/test-results', 'converter/app/build/test-results'):
              for path in Path(root).rglob('TEST-*.xml'):
                  for case in ET.parse(path).getroot().iter('testcase'):
                      for failure in case.findall('failure') + case.findall('error'):
                          message = (str(path) + ': ' + case.get('name', '') + ': ' + (failure.text or failure.get('message', '')))[:5000]
                          print('::warning::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          # Gradle's failure summary prints only the first Android lint finding;
          # surface every finding so CI diagnostics are actionable without fetching artifacts.
          for path in Path('app/build/intermediates/lint_intermediate_text_report').rglob('lint-results-*.txt'):
              report = path.read_text(errors='replace').splitlines()
              for index, line in enumerate(report):
                  if ': Error:' not in line:
                      continue
                  detail = '\n'.join(report[index:min(len(report), index + 4)])
                  message = (str(path) + ': ' + detail)[:5000]
                  print('::warning::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
      # Only published on failure: a successful run produces exactly the APK artifact.
      - name: Preserve build logs and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ inputs.variant }}
          include-hidden-files: true
          path: |
            .local/logs/
            app/build/reports/
            app/build/intermediates/lint_intermediate_text_report/
            app/build/test-results/
            converter/app/build/reports/
            converter/app/build/test-results/
            .local/angle-build/angle/out/PodNative/args.gn
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/podnative.jks"
