plugins { id 'com.android.application' }
android {
    namespace 'org.podnative'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.podnative'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '0.9.3-anyios-preview'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++20' } }
        buildConfigField 'String', 'SOURCE_REVISION', '"' + (System.getenv('GITHUB_SHA') ?: 'local-uncommitted') + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    signingConfigs {
        // Preview builds are non-debuggable but reuse the cached development
        // certificate, so they still upgrade an installed debug build.
        def previewStore = System.getenv('PODNATIVE_PREVIEW_KEYSTORE')
        if (previewStore) {
            preview {
                storeFile file(previewStore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (System.getenv('PODNATIVE_KEYSTORE')) {
            release {
                storeFile file(System.getenv('PODNATIVE_KEYSTORE'))
                storePassword System.getenv('PODNATIVE_STORE_PASSWORD')
                keyAlias System.getenv('PODNATIVE_KEY_ALIAS')
                keyPassword System.getenv('PODNATIVE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PODNATIVE_KEYSTORE')) {
                signingConfig signingConfigs.release
            } else if (System.getenv('PODNATIVE_PREVIEW_KEYSTORE')) {
                signingConfig signingConfigs.preview
            }
        }
    }
    lint { abortOnError true }
}

dependencies {
    implementation project(':converter')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
